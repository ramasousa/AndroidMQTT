# Configuração de DESENVOLVIMENTO. Não use isto em produção.
#
# `allow_anonymous true` existe para o simulador subir sem cerimônia. Num broker
# real: usuários com senha, ACL por tópico e TLS na 8883. Veja docs/SEGURANCA.md.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice
log_type warning
log_type error

# Limites sensatos, mesmo em desenvolvimento: mensagem gigante em broker aberto
# é um jeito fácil de derrubar a própria máquina.
message_size_limit 262144
max_queued_messages 1000
