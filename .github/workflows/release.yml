# Publica o APK de demonstração como release, com URL pública e estável.
#
# Por que isso importa: o APK produzido pelo CI vive dentro de um zip de
# artefato, que exige login no GitHub para baixar. Nenhum emulador de navegador
# — Appetize, BrowserStack e afins — consegue buscá-lo sozinho por causa disso.
# Um asset de release é um arquivo público e direto: cola-se a URL no serviço e
# ele carrega o app.
#
# Só roda quando alguém aperta "Run workflow". Publicar algo no perfil público
# de outra pessoa é decisão dela, não do pipeline.
name: Release de demonstração

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (a mesma sempre mantém a URL estável)"
        required: false
        default: "demo"

permissions:
  contents: write

jobs:
  publicar:
    name: Publicar APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Montar o APK de debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Renomear para um nome apresentável
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/pulso-demo.apk
          ls -la release/

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || 'demo' }}
          name: Pulso — build de demonstração
          body: |
            APK de demonstração do Pulso, para experimentar o app sem compilar nada.

            **Abre em modo demonstração:** uma casa simulada completa — lâmpada,
            tomada, sensores de temperatura e umidade, sensor de porta — com
            telemetria ao vivo. Não precisa de broker, hardware nem rede.

            **Para rodar num emulador de navegador** (útil em iPad, iPhone ou
            qualquer máquina sem Android), cole esta URL no serviço:

            ```
            https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || 'demo' }}/pulso-demo.apk
            ```

            **Para instalar num Android de verdade:** baixe o arquivo e abra.
            Será preciso permitir a instalação de fontes desconhecidas.

            Build de *debug*, assinado com a chave de depuração padrão. Serve
            para experimentar e revisar; não é um build de produção.

            Commit: ${{ github.sha }}
          files: release/pulso-demo.apk
          draft: false
          prerelease: true
