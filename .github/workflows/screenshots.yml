# Roda o app num emulador na nuvem e devolve screenshots e vídeo.
#
# Serve a quem não tem um aparelho Android à mão: os artefatos deste workflow
# abrem em qualquer navegador, inclusive no celular. Fica fora do ci.yml de
# propósito — emulador é lento e ocasionalmente instável, e isso não deve
# derrubar o sinal de build do projeto.
name: Screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'core/**'
      - 'scripts/screenshots.sh'
      - '.github/workflows/screenshots.yml'

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulador:
    name: Emulador Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Montar o APK de debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # O emulador precisa de aceleração por hardware; sem isso ele sobe por
      # software e estoura o timeout.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/screenshots.sh

      - name: Publicar screenshots e vídeo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulso-em-execucao
          path: artefatos/
          if-no-files-found: warn

      - name: Publicar o APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulso-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
